name: Run Tests

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: LMS
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "True"
      DB_NAME: LMS
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_URL_PAGES: redis://127.0.0.1:6379/2
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      EMAIL_HOST_USER: ci@example.com
      EMAIL_HOST_PASSWORD: dummy-not-used-in-tests
      CLOUDINARY_CLOUD_NAME: dummy
      CLOUDINARY_API_KEY: dummy
      CLOUDINARY_API_SECRET: dummy
      CSRF_TRUSTED_ORIGINS: http://localhost

      # settings.py switches the database and both Redis connections to a
      # separate test stack whenever it detects pytest, so the suite can run
      # cache.clear() without wiping the dev cache. Those defaults name the
      # docker-compose hosts (database-test, redis-test), which do not exist
      # here -- without these overrides every test errors at setup with
      # "Unknown MySQL server host 'database-test'". Point them at the service
      # containers above, keeping the same database numbering as local:
      # 0 cache, 1 pages, 2 broker, 3 results.
      TEST_DB_HOST: 127.0.0.1
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL_PAGES: redis://127.0.0.1:6379/1
      TEST_CELERY_BROKER_URL: redis://127.0.0.1:6379/2
      TEST_CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create /code (compiler upload dir, normally the code_files volume)
        run: |
          sudo mkdir -p /code
          sudo chown "$(whoami)" /code

      - name: Wait for MySQL to be ready
        run: |
          until mysqladmin ping -h127.0.0.1 -P3306 -uroot -proot --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Run migrations
        run: python manage.py migrate

      - name: Run test suite
        run: pytest -v --tb=short
