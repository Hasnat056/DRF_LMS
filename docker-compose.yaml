services:
  # Redis
  redis-server:
    image: redis:latest
    container_name: nexusapi-redis-server
    command: redis-server --appendonly yes
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    networks:
      - nexus_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    env_file:
      - .env
    image: mysql:8.0
    container_name: nexusapi-database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nexus_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DRF backend
  backend:
    env_file:
      - .env
    # Built from the root Dockerfile, which bakes the code in, so this service
    # deliberately has no bind mount of the repo over /app. Application changes
    # need `docker compose build backend`. The live-mounted image is
    # tests/Dockerfile, used only by tests/docker-compose.yaml.
    build: .
    container_name: nexusapi-backend
    restart: unless-stopped
    volumes:
      - code_files:/code
      - static_files:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      redis-server:
        condition: service_healthy
      python-compiler:
        condition: service_started
      c-compiler:
        condition: service_started
      java-compiler:
        condition: service_started
    networks:
      - nexus_network

  # Celery worker
  celery-worker:
    env_file:
      - .env
    build: .
    container_name: nexusapi-celery-worker
    command: celery -A NexusAPI worker --loglevel=info
    restart: unless-stopped
    depends_on:
      redis-server:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - nexus_network

  # Celery beat (periodic scheduler — drives the lifecycle reconciliation sweep)
  celery-beat:
    env_file:
      - .env
    build: .
    container_name: nexusapi-celery-beat
    command: celery -A NexusAPI beat --loglevel=info
    restart: unless-stopped
    depends_on:
      redis-server:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - nexus_network

  # Nginx
  nginx:
    image: nginx:alpine
    container_name: nexusapi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/app/staticfiles:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - nexus_network

  # Python compiler
  python-compiler:
    build: ./Compilers/python_compiler
    restart: unless-stopped
    volumes:
      - code_files:/code
    networks:
      - nexus_network
    deploy:
      replicas: 2

  # C/C++ compiler
  c-compiler:
    build: ./Compilers/c_compiler
    restart: unless-stopped
    volumes:
      - code_files:/code
    networks:
      - nexus_network
    deploy:
      replicas: 2

  # Java compiler
  java-compiler:
    build: ./Compilers/java_compiler
    restart: unless-stopped
    volumes:
      - code_files:/code
    networks:
      - nexus_network
    deploy:
      replicas: 2


volumes:
  code_files:
  mysql_data:
  static_files:
  redis_data:

networks:
  nexus_network:
    driver: bridge


