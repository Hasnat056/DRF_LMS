services:
  # Redis
  redis-server:
    image: redis/redis-stack
    container_name: redis-server
    ports:
      - "6379:6379"
      - "8001:8001"
    networks:
      - nexus_network

  database:
    env_file:
      - .env
    image: mysql:8.0
    container_name: database
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nexus_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DRF backend
  backend:
    env_file:
      - .env
    build: .
    container_name: backend
    volumes:
      - code_files:/code
      - static_files:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      redis-server:
        condition: service_started
      python-compiler:
        condition: service_started
      c-compiler:
        condition: service_started
      java-compiler:
        condition: service_started
    networks:
      - nexus_network

  # Celery worker
  celery-worker:
    env_file:
      - .env
    build: .
    container_name: celery-worker
    command: celery -A NexusAPI worker --loglevel=info
    depends_on:
      - redis-server
      - backend
    networks:
      - nexus_network

  # Nginx
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/app/staticfiles:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - nexus_network

  # Python compiler
  python-compiler:
    build: ./Compilers/python_compiler
    volumes:
      - code_files:/code
    networks:
      - nexus_network
    deploy:
      replicas: 2

  # C/C++ compiler
  c-compiler:
    build: ./Compilers/c_compiler
    volumes:
      - code_files:/code
    networks:
      - nexus_network
    deploy:
      replicas: 2

  # Java compiler
  java-compiler:
    build: ./Compilers/java_compiler
    volumes:
      - code_files:/code
    networks:
      - nexus_network
    deploy:
      replicas: 2

volumes:
  code_files:
  mysql_data:
  static_files:

networks:
  nexus_network:
    driver: bridge


