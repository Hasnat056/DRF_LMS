events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream django_backend {
        server backend:8000;
    }

    # HTTP — redirects to HTTPS
    server {
        listen 80;
        server_name nexusapi.eastasia.cloudapp.azure.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name nexusapi.eastasia.cloudapp.azure.com;

        ssl_certificate /etc/letsencrypt/live/nexusapi.eastasia.cloudapp.azure.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nexusapi.eastasia.cloudapp.azure.com/privkey.pem;

        location /static/ {
            alias /app/staticfiles/;
        }

        location / {
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        client_max_body_size 20M;
    }
}
