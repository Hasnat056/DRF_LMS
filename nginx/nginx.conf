events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream django_backend {
        server backend:8000;
    }

    # HTTP — redirects to HTTPS once SSL is set up
    server {
        listen 80;
        server_name _;

        # Certbot challenge — needed for SSL certificate issuance
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Uncomment this after SSL is set up
        # location / {
        #     return 301 https://$host$request_uri;
        # }

        # Remove everything below this comment after SSL is set up
        location /static/ {
            alias /app/staticfiles/;
        }

        location / {
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        client_max_body_size 20M;
    }

    # HTTPS — uncomment this entire block after SSL is set up
    # server {
    #     listen 443 ssl;
    #     server_name yourname.eastus.cloudapp.azure.com;
    #
    #     ssl_certificate /etc/letsencrypt/live/yourname.eastus.cloudapp.azure.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/yourname.eastus.cloudapp.azure.com/privkey.pem;
    #
    #     location /static/ {
    #         alias /app/staticfiles/;
    #     }
    #
    #     location / {
    #         proxy_pass http://django_backend;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     }
    #
    #     client_max_body_size 20M;
    # }
}